<html>
<head>
  <link rel="stylesheet" href="/static/bootstrap.min.css"/>

</head>
<div>
  <nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; height: 1in;">
    <div class="container-fluid">
      <h2 style="padding-right: 5%;">Dealerships</h2>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
          <li class="nav-item"><a class="nav-link active" href="/contact">Contact Us</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="card" style="width:80%;margin:auto;margin-top:5%;">
    <div class="card-body">
      <h1 style="text-align:center;padding:20px;">Contact Us</h1>
      <img src="/static/contactus.png" alt="Contact Us" style="width:100%;max-height:300px;object-fit:cover;"/>
      <div style="padding:20px;">
        <h3>Best Cars Dealership</h3>
        <p><strong>Address:</strong> 123 Main Street, Springfield, IL 62701, USA</p>
        <p><strong>Phone:</strong> +1 (217) 555-0100</p>
        <p><strong>Email:</strong> support@bestcars.com</p>
        <p><strong>Business Hours:</strong> Monday - Friday: 9:00 AM - 6:00 PM</p>
        <h4 style="margin-top:20px;">Send Us a Message</h4>
        <form>
          <div class="mb-3">
            <label class="form-label">Your Name</label>
            <input type="text" class="form-control" placeholder="Enter your name">
          </div>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" placeholder="Enter your email">
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="4" placeholder="Your message"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
      </div>
    </div>
  </div>
